[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slate-db"
version = "1.0.0"
description = "Python client and PyArrow/NumPy bridge for Slate HTAP database"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "urllib3>=1.26.0"
]

[project.optional-dependencies]
analytics = [
    "numpy>=1.20.0",
    "pyarrow>=10.0.0",
    "pandas>=1.5.0"
]
dev = [
    "pytest>=7.0.0"
]
